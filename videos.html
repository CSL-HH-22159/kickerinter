<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spreeliga Monolog – Videos</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #07101e;
  --bg2:        #0d1b2d;
  --card:       #0f2035;
  --card-hover: #132844;
  --border:     #1a3050;
  --blue:       #2563eb;
  --blue-light: #3b82f6;
  --blue-muted: #1e3a5f;
  --gold:       #f5c518;
  --red:        #ff0000;
  --text:       #e2e8f0;
  --muted:      #64748b;
  --muted2:     #94a3b8;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* ── Header ── */
.site-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 40px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-center-logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  height: 100px;
  width: auto;
  filter: drop-shadow(0 0 14px rgba(56,152,255,.3));
  pointer-events: none;
}
.site-logo { height: 100px; width: auto; }
.header-nav { margin-left: auto; display: flex; gap: 8px; }
.nav-link {
  color: var(--muted2);
  text-decoration: none;
  font-size: .82rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  transition: all .2s;
  background: rgba(13,27,45,.6);
  backdrop-filter: blur(8px);
}
.nav-link:hover { color: var(--text); border-color: var(--blue-light); background: var(--blue-muted); }

/* ── Page Header ── */
.page-header {
  max-width: 1100px;
  margin: 0 auto;
  padding: 52px 24px 36px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted2);
  text-decoration: none;
  margin-bottom: 22px;
  transition: color .2s;
}
.back-link:hover { color: var(--blue-light); }
.page-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--red);
  background: rgba(255,0,0,.08);
  border: 1px solid rgba(255,0,0,.2);
  padding: 4px 14px 4px 10px;
  border-radius: 20px;
  margin-bottom: 16px;
}
.page-badge svg { flex-shrink: 0; }
.page-header h1 {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.1;
  margin-bottom: 10px;
}
.page-header p {
  font-size: .95rem;
  color: var(--muted2);
  line-height: 1.7;
  max-width: 560px;
}

/* ── Filter Tabs ── */
.filter-row {
  max-width: 1100px;
  margin: 0 auto 36px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-btn {
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted2);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 18px;
  cursor: pointer;
  transition: all .2s;
}
.filter-btn:hover { color: var(--text); border-color: var(--blue-light); }
.filter-btn.active {
  color: var(--bg);
  background: var(--blue-light);
  border-color: var(--blue-light);
}
.filter-count {
  font-size: .65rem;
  font-weight: 700;
  color: var(--muted);
  margin-left: auto;
  letter-spacing: .08em;
}

/* ── Container ── */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ── Section Label ── */
.section-label {
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--blue-light);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-wrap { margin-bottom: 56px; }
.section-wrap.hidden { display: none; }
.division-wrap.hidden { display: none; }

/* ── Video Grid ── */
.video-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.video-grid.specials {
  grid-template-columns: repeat(3, 1fr);
  max-width: 800px;
}

/* ── Video Card ── */
.video-card {
  display: block;
  text-decoration: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: transform .22s, border-color .22s, box-shadow .22s;
  position: relative;
}
.video-card:hover {
  transform: translateY(-4px);
  border-color: var(--blue-muted);
  box-shadow: 0 12px 32px rgba(0,0,0,.4);
}
.video-card:hover .play-overlay { opacity: 1; }
.video-card:hover .thumb-img { filter: brightness(.75); }

/* Thumbnail */
.thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #0a1929;
  overflow: hidden;
}
.thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter .22s;
}
.thumb-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f2035 0%, #1a3050 100%);
}
.thumb-fallback svg { opacity: .3; }

/* Play overlay */
.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .22s;
  background: rgba(0,0,0,.25);
}
.play-btn {
  width: 52px;
  height: 52px;
  background: rgba(255,0,0,.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.5);
}
.play-btn svg { margin-left: 3px; }

/* Card info */
.card-info {
  padding: 10px 12px 12px;
}
.card-type {
  font-size: .63rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}
.card-title {
  font-size: .88rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.video-card.special .card-type { color: var(--gold); }
.video-card.special { border-color: rgba(245,197,24,.2); }
.video-card.special:hover { border-color: rgba(245,197,24,.5); }

/* ── Responsive ── */
@media (max-width: 900px) {
  .video-grid { grid-template-columns: repeat(3, 1fr); }
  .video-grid.specials { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .site-header { padding: 14px 16px; }
  .site-logo { height: 60px; }
  .header-center-logo { height: 60px; }
  .header-nav { display: none; }
  .page-header, .filter-row, .container { padding-left: 14px; padding-right: 14px; }
  .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .video-grid.specials { grid-template-columns: repeat(1, 1fr); max-width: 100%; }
}
@media (max-width: 380px) {
  .video-grid { grid-template-columns: 1fr; }
}

/* ── Footer ── */
footer {
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 28px 24px;
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
}
footer img { height: 28px; vertical-align: middle; margin-right: 8px; opacity: .6; }
</style>
</head>
<body>

<header class="site-header">
  <img class="site-logo" src="Spreeliga Monolog.webp" alt="Spreeliga Monolog"
       onerror="this.style.display='none'">
  <img src="Spreeliga Logo frei fixed.webp" alt="Spreeliga"
       class="header-center-logo"
       onerror="this.style.display='none'">
  <nav class="header-nav">
    <a class="nav-link" href="portal.html">← Portal</a>
    <a class="nav-link" href="chronik.html">Chronik</a>
  </nav>
</header>

<div class="page-header">
  <a href="portal.html" class="back-link">← Zurück zum Portal</a>
  <div class="page-badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 4-8 4z"/></svg>
    Spreeliga Monolog auf YouTube
  </div>
  <h1>Die Videos</h1>
  <p>Alle Folgen des Spreeliga Monologs – Spreeliga, Spreeklasse und Spreeoberliga, Spieltag für Spieltag, Transfers, Specials und Sonderfolgen.</p>
</div>

<div class="filter-row">
  <button class="filter-btn active" onclick="filter('all', this)">Alle</button>
  <button class="filter-btn" onclick="filter('sl2627', this)">Spreeliga 26/27</button>
  <button class="filter-btn" onclick="filter('sl2526', this)">Spreeliga 25/26</button>
  <button class="filter-btn" onclick="filter('spreeklasse', this)">Spreeklasse</button>
  <button class="filter-btn" onclick="filter('spreeoberliga', this)">Spreeoberliga</button>
  <span class="filter-count" id="video-count">41 Videos</span>
</div>

<div class="container" id="video-container"></div>

<footer>
  <img src="Spreeliga Monolog.webp" alt="Logo" onerror="this.style.display='none'">
  Spreeliga Monolog · KickerInter · 21 Jahre Liga
</footer>

<script>
// ─── Datenquelle: VideoLinks.xlsx (Sheets "Saison 25_26", "Saison 26_27", "Spreeklasse", "Spreeoberliga") ───
const DIVISIONS = [
  {
    key: 'sl2627', label: 'Spreeliga 26/27',
    sections: [
      { label: 'Saison 2026/27 — Videos', type: 'Spreeliga 26/27', special: false, videos: [
        { title: 'Kaderanalyse', id: '0McD48jQJ6g' },
      ]},
    ],
  },
  {
    key: 'sl2526', label: 'Spreeliga 25/26',
    sections: [
      { label: 'Saison 2025/26 — Spieltage', type: 'Saison 25/26', special: false, videos: [
        { title: 'Spieltag 1',  id: 'DJKxBcxpPho' },
        { title: 'Spieltag 2',  id: 'Jlwchis6ZEo' },
        { title: 'Spieltag 3',  id: 'bkb9SPYGM_Y' },
        { title: 'Spieltag 4',  id: 'WewiJEiWynY' },
        { title: 'Spieltag 5',  id: '3JsqkCbt8ds' },
        { title: 'Spieltag 6',  id: 'ZuOuDxBKVqQ' },
        { title: 'Spieltag 7',  id: 'g9ViaKsJieE' },
        { title: 'Spieltag 8',  id: 'DM6Ppk1ROjc' },
        { title: 'Spieltag 9',  id: 'xl9WT7sf08o' },
        { title: 'Spieltag 10', id: 'EgXpEFZ9CIE' },
        { title: 'Spieltag 11', id: 'rbhwD1NF71g' },
        { title: 'Spieltag 12', id: 'doPT-k5jnWU' },
        { title: 'Spieltag 13', id: 'dw-PdQgyAHg' },
        { title: 'Spieltag 14', id: '73Cuq4uSfT0' },
        { title: 'Spieltag 15', id: 'GgtwhZaGrAg' },
        { title: 'Spieltag 16', id: 'lXkK1QPWTEU' },
        { title: 'Spieltag 17', id: '1Z7yaN5Fcnc' },
        { title: 'Spieltag 18', id: 'gREEmS8Yhfs' },
        { title: 'Spieltag 19', id: 'fB-Eu61FsTo' },
        { title: 'Spieltag 20', id: 'Swb3KsudHRA' },
        { title: 'Spieltag 21', id: '6luhNZ1wtec' },
        { title: 'Spieltag 22', id: 'XGUu1lCvWxs' },
        { title: 'Spieltag 23', id: 'kt9zv1fIvPM' },
        { title: 'Spieltag 24', id: '-hRoBYj2hms' },
        { title: 'Spieltag 25', id: 'E-3_oeYd1VM' },
        { title: 'Spieltag 26', id: '5dcJlI25rvo' },
        { title: 'Spieltag 27', id: 'AMUQNHjQD1k' },
        { title: 'Spieltag 28', id: 'WErWf5rUkMA' },
        { title: 'Spieltag 29', id: 'avYXdHVEDmQ' },
        { title: 'Spieltag 30', id: 'a71-H9COoB8' },
        { title: 'Spieltag 31', id: '0nDA3Jgq_ic' },
        { title: 'Spieltag 32', id: 'CDeGezX6Dzo' },
        { title: 'Spieltag 33', id: 'Do5eyjhnJFg' },
        { title: 'Spieltag 34', id: 'JC-LKnzoMss' },
      ]},
      { label: 'Saison 2025/26 — Sonderfolgen', type: 'Sonderfolge', special: true, videos: [
        { title: 'Eindhoven',       id: '0jinZV55u7I' },
        { title: 'Schneidi',        id: 'KZGb-om7j6c' },
        { title: 'Wintertransfers', id: 'YDfChTKggGQ' },
        { title: 'Finale Analyse',  id: 'Aysodu7T0zU' },
      ]},
    ],
  },
  {
    key: 'spreeklasse', label: 'Spreeklasse',
    sections: [
      { label: 'Spreeklasse — Saisonanalyse & Historie', type: 'Spreeklasse', special: false, videos: [
        { title: 'Saisonanalyse und Historie', id: 'ODa8OPTk01M' },
      ]},
    ],
  },
  {
    key: 'spreeoberliga', label: 'Spreeoberliga',
    sections: [
      { label: 'Spreeoberliga — Saisonanalyse & Historie', type: 'Spreeoberliga', special: false, videos: [
        { title: 'Saisonanalyse und Historie', id: 'WvSelp9eEQM' },
      ]},
    ],
  },
];

const TOTAL_COUNT = DIVISIONS.reduce((sum, d) => sum + d.sections.reduce((s, sec) => s + sec.videos.length, 0), 0);

const PLAY_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>`;
const VIDEO_ICON = `<svg width="48" height="48" viewBox="0 0 24 24" fill="#3b82f6"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 4-8 4z"/></svg>`;

function makeCard(videoId, typeLabel, titleLabel, isSpecial) {
  const thumb = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
  const url   = `https://youtu.be/${videoId}`;
  return `
    <a class="video-card${isSpecial ? ' special' : ''}" href="${url}" target="_blank" rel="noopener">
      <div class="thumb-wrap">
        <img class="thumb-img" src="${thumb}" alt="${titleLabel}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="thumb-fallback" style="display:none">${VIDEO_ICON}</div>
        <div class="play-overlay">
          <div class="play-btn">${PLAY_ICON}</div>
        </div>
      </div>
      <div class="card-info">
        <div class="card-type">${typeLabel}</div>
        <div class="card-title">${titleLabel}</div>
      </div>
    </a>`;
}

// Render alle Divisions
const container = document.getElementById('video-container');
container.innerHTML = DIVISIONS.map(div => `
  <div class="division-wrap" data-division="${div.key}">
    ${div.sections.map(sec => `
      <div class="section-wrap">
        <div class="section-label">${sec.label}</div>
        <div class="video-grid${sec.special ? ' specials' : ''}">
          ${sec.videos.map(v => makeCard(v.id, sec.type, v.title, sec.special)).join('')}
        </div>
      </div>
    `).join('')}
  </div>
`).join('');

function vidLabel(n) { return `${n} ${n === 1 ? 'Video' : 'Videos'}`; }
document.getElementById('video-count').textContent = vidLabel(TOTAL_COUNT);

// Filter
function filter(key, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const count = document.getElementById('video-count');
  document.querySelectorAll('.division-wrap').forEach(el => {
    el.classList.toggle('hidden', key !== 'all' && el.dataset.division !== key);
  });

  if (key === 'all') {
    count.textContent = vidLabel(TOTAL_COUNT);
  } else {
    const div = DIVISIONS.find(d => d.key === key);
    const n = div.sections.reduce((s, sec) => s + sec.videos.length, 0);
    count.textContent = vidLabel(n);
  }
}
</script>
</body>
</html>
