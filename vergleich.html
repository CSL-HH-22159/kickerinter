<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spreeliga – Saison 2026/27</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #1a3a6b;
    --accent: #e8b800;
    --bg: #f0f4f9;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #d1d9e6;
    --green: #16a34a;
    --red: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--primary); color: white; padding: 14px 32px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: .85rem; color: #adc6ff; }
  .logo { font-size: 1.9rem; }
  .portal-link { color: #adc6ff; text-decoration: none; font-size: .82rem; font-weight: 600; padding: 6px 12px; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; transition: background .2s, color .2s; }
  .portal-link:hover { background: rgba(255,255,255,.15); color: #fff; }
  .hdr-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .imp-btn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 7px 13px; font-size: .82rem; font-weight: 600; cursor: pointer; transition: background .2s; }
  .imp-btn:hover { background: rgba(255,255,255,.25); }
  .imp-btn.warn { border-color: rgba(255,120,120,.6); color: #ffc9c9; }

  .status-bar { background: #10264a; color: #adc6ff; font-size: .8rem; padding: 6px 32px; display: flex; gap: 18px; flex-wrap: wrap; }
  .status-bar b { color: var(--accent); font-weight: 600; }

  .tabs { display: flex; background: var(--primary); padding: 0 32px; gap: 4px; flex-wrap: wrap; }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; color: #adc6ff; font-size: .9rem; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s; letter-spacing: .3px; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: white; }

  .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }
  .card .hint { font-size: .8rem; color: var(--muted); margin-top: -10px; margin-bottom: 14px; }

  .selectors { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
  .selector-group { display: flex; flex-direction: column; gap: 6px; }
  .selector-group label { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .selector-group select, .selector-group input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; background: var(--bg); color: var(--text); min-width: 160px; }
  .selector-group select:focus, .selector-group input:focus { outline: none; border-color: var(--primary); }

  table.dt { width: 100%; border-collapse: collapse; font-size: .87rem; }
  table.dt th { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
  table.dt td { padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.dt tr:hover td { background: #f6f9fd; }
  table.dt td.num, table.dt th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos-chip { display: inline-block; font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; color: #fff; }
  .pos-TOR { background: #b45309; } .pos-ABW { background: #1d4ed8; } .pos-MFD { background: #047857; } .pos-STU { background: #b91c1c; }
  .good { color: var(--green); font-weight: 600; }
  .bad  { color: var(--red);  font-weight: 600; }
  .badge { display: inline-block; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; color: #374151; }
  .badge.gone { background: #fee2e2; color: #b91c1c; }
  .badge.new  { background: #dcfce7; color: #15803d; }
  .color-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .chart-wrap { overflow-x: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 10px; font-size: .8rem; }
  .legend span { cursor: pointer; user-select: none; }
  .legend span.off { opacity: .3; }

  /* Kader-Karten */
  .kader-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 18px; }
  .mgr-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
  .mgr-card .mc-head { background: var(--primary); color: #fff; padding: 10px 14px; display: flex; align-items: baseline; gap: 10px; }
  .mgr-card .mc-head .mc-name { font-weight: 700; }
  .mgr-card .mc-head .mc-meta { font-size: .78rem; color: #adc6ff; margin-left: auto; }
  .mc-body { display: flex; gap: 0; }
  /* Rasen: Streifen ZUERST, darunter der grüne Verlauf. Beide müssen in derselben
     background-image-Angabe stehen — sonst überschreibt die zweite die erste. */
  .pitch { flex: 0 0 300px; padding: 12px 6px; display: flex; flex-direction: column;
    justify-content: space-around; gap: 6px;
    background-color: #2e9e4f;
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 34px, rgba(0,0,0,.07) 34px 68px),
      linear-gradient(180deg, #35ad58 0%, #1f7038 100%); }
  .p-row { display: flex; justify-content: space-evenly; }
  .p-chip { display: flex; flex-direction: column; align-items: center; width: 62px; }
  .p-chip img, .p-chip .initials { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; background: #fff; object-fit: cover; }
  .p-chip .initials { display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; color: #fff; }
  .p-chip .pn { font-size: .67rem; color: #fff; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6); margin-top: 3px; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-chip .pp { font-size: .68rem; font-weight: 800; background: rgba(0,0,0,.62); color: var(--accent); border-radius: 8px; padding: 1px 7px; margin-top: 2px; }
  .bench { flex: 1; padding: 10px 12px; font-size: .78rem; }
  .bench h4 { font-size: .7rem; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; margin: 6px 0 4px; }
  .bench .b-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dashed #edf0f5; }
  .bench .b-row .b-pts { font-variant-numeric: tabular-nums; font-weight: 600; }

  .h2h-wrap { overflow-x: auto; }
  table.h2h { border-collapse: collapse; font-size: .78rem; }
  table.h2h th, table.h2h td { padding: 5px 8px; border: 1px solid var(--border); text-align: center; white-space: nowrap; }
  table.h2h th.rowh { text-align: left; }
  table.h2h td.win { background: #dcfce7; } table.h2h td.loss { background: #fee2e2; } table.h2h td.draw { background: #fef9c3; } table.h2h td.self { background: #f1f5f9; color: #cbd5e1; }

  .empty-note { text-align: center; color: var(--muted); padding: 40px 10px; font-size: .95rem; }
  .pending-note { border:1px dashed var(--border); border-radius:8px; padding:10px 12px;
    color:var(--muted); font-size:.8rem; line-height:1.55; background:#fafcff; margin-top:10px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .tile .lbl { font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; }
  .tile .val { font-size:1.25rem; font-weight:700; color:var(--primary); margin-top:3px; }
  .tile .val small { font-size:.72rem; font-weight:600; color:var(--muted); }
  .pos-chip { display:inline-block; font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:10px; color:#fff; }
  .pos-TOR { background:#b45309; } .pos-ABW { background:#1d4ed8; }
  .pos-MFD { background:#047857; } .pos-STU { background:#b91c1c; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 20px; }
  input[type=file] { display: none; }
</style>

<script>
/* ================= Grunddaten & Zustand ================= */
const POSN = ['TOR','ABW','MFD','STU'];
const POSLABEL = {TOR:'Tor', ABW:'Abwehr', MFD:'Mittelfeld', STU:'Sturm'};
const FORMATIONS = [[4,3,3],[4,5,1],[5,3,2],[5,4,1],[3,5,2],[3,4,3],[4,4,2]]; // ABW,MFD,STU
const CSV_POSMAP = {GOALKEEPER:'TOR', DEFENDER:'ABW', MIDFIELDER:'MFD', FORWARD:'STU', STRIKER:'STU'};
const PHOTO_YEARS = ['2026','2025'];
const COLORS = ['#1a3a6b','#e8b800','#dc2626','#16a34a','#7c3aed','#ea580c','#0891b2','#be185d','#4d7c0f','#6b7280','#92400e','#1d4ed8'];
const LS = {saison:'ki26_saison', players:'ki26_players', mgr:'ki26_mgrpts'};
// Homepage = reine Info-Seite. Import-Werkzeuge nur bei Aufruf mit ?import (lokale Pflege).
const IMPORT_MODE = new URLSearchParams(location.search).has('import');
let AUTOLOAD_DONE = false;

let HISTORIE = null; // historie/manager.json — sechs Saisons Spreeliga
let STATS    = null; // stats/saison.json — Kicker-Leistungsdaten je Spieler
let CLIENTDB = null; // clientdb.json — Spielplan, Vereine
let VORSAISON= null; // historie/players-<jahr>.csv — Basis für Vereinsstärke
let SAISON = null;   // {rows:[{manager,spieler,verein,pos,st:{n:{p,r}}}], src}
let PLAYERS = [];    // offizielle Kicker-CSV
let MGRPTS = null;   // {manager:{st:pts}}
let IDX = null;      // abgeleiteter Index
const hiddenSeries = new Set();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n, d=0){ return (n==null||isNaN(n)) ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:d, maximumFractionDigits:d}); }
function norm(s){ return String(s||'').toLowerCase().replace(/[.\s\-']/g,''); }

/* ================= Parser ================= */
function parseSaisonRows(aoa){
  // aoa = Array of Arrays, Zeile 0 = Header
  const head = (aoa[0]||[]).map(h=>String(h==null?'':h).trim());
  const col = {};
  const stCols = {}; // n -> {p:idx, r:idx}
  head.forEach((h,i)=>{
    const hl = h.toLowerCase();
    if(hl==='manager') col.manager=i;
    else if(hl==='spieler'||hl==='name') col.spieler=i;
    else if(hl==='verein') col.verein=i;
    else if(hl==='position') col.pos=i;
    else {
      let m = hl.match(/^(?:st|spieltag)\s*(\d+)\s*(punkte|rolle|status)$/);
      if(m){ const n=+m[1]; stCols[n]=stCols[n]||{}; stCols[n][m[2]==='punkte'?'p':'r']=i; }
    }
  });
  if(col.manager==null || col.spieler==null || col.pos==null)
    throw new Error('Header nicht erkannt. Erwartet: Manager | Spieler | Verein | Position | ST1 Punkte | ST1 Rolle …');
  const rows=[];
  for(let r=1;r<aoa.length;r++){
    const a=aoa[r]; if(!a || !String(a[col.manager]||'').trim()) continue;
    const row={ manager:String(a[col.manager]).trim(), spieler:String(a[col.spieler]||'').trim(),
                verein:String(a[col.verein!=null?col.verein:'']||'').trim(),
                pos:String(a[col.pos]||'').trim().toUpperCase(), st:{} };
    if(!POSN.includes(row.pos)) row.pos = CSV_POSMAP[row.pos] || row.pos;
    for(const n in stCols){
      const c=stCols[n];
      const rv = c.r!=null ? String(a[c.r]==null?'':a[c.r]).trim() : '';
      let pv = c.p!=null ? a[c.p] : null;
      if(pv==='' || pv==null) pv=null; else pv=Number(String(pv).replace(',','.'));
      if(rv==='' && pv==null) continue; // Spieler an dem ST nicht im Kader
      const r0 = rv.toUpperCase().charAt(0);
      row.st[n] = { p:(pv!=null&&!isNaN(pv))?pv:null, r: r0==='S' ? 'S' : 'B' };
    }
    rows.push(row);
  }
  if(!rows.length) throw new Error('Keine Datenzeilen gefunden.');
  return {rows};
}
function parseSaisonXlsx(buf){
  const wb = XLSX.read(buf, {type:'array'});
  const shName = wb.SheetNames.find(n=>n.toLowerCase()==='kader') || wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[shName], {header:1, defval:''});
  return parseSaisonRows(aoa);
}
function parseSaisonCsv(text){
  const lines = text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  return parseSaisonRows(lines.map(l=>l.split(';')));
}
const MONATE = {jan:1,feb:2,mrz:3,'mär':3,maer:3,apr:4,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dez:12};
function parseNote(v){
  if(v==null) return null;
  let s=String(v).trim(); if(!s||s==='0'||s==='0.0'||s==='0,0') return null;
  const m = s.toLowerCase().match(/^([a-zä]+)\.?\s+(\d{1,2})$/) || s.toLowerCase().match(/^(\d{1,2})\.?\s+([a-zä]+)\.?$/);
  if(m){ // Excel-Datums-Korruption: "Mrz 18" = 3,18
    const mon = MONATE[m[1]]!=null?MONATE[m[1]]:MONATE[m[2]];
    const day = +( MONATE[m[1]]!=null ? m[2] : m[1] );
    if(mon!=null && day) return mon + day/100;
  }
  const n = Number(s.replace(',','.'));
  return isNaN(n)?null:n;
}
function parsePlayersCsv(text){
  const lines = text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  const head = lines[0].split(';').map(h=>h.trim());
  const gi = name => head.findIndex(h=>h.toLowerCase().startsWith(name));
  const c = {id:gi('id'), vn:gi('vorname'), nn:gi('nachname'), kurz:head.findIndex(h=>/kurz/i.test(h)),
             name:head.findIndex((h,i)=>/angezeigter name$/i.test(h)||h.toLowerCase()==='name'), verein:gi('verein'),
             pos:gi('position'), mw:gi('marktwert'), pts:gi('punkte'), note:head.findIndex(h=>/note/i.test(h))};
  const out=[];
  for(let i=1;i<lines.length;i++){
    const a=lines[i].split(';');
    if(a.length<5) continue;
    out.push({ id:a[c.id], vorname:a[c.vn], nachname:a[c.nn], kurz:a[c.kurz], name:a[c.name],
      verein:a[c.verein], pos:CSV_POSMAP[String(a[c.pos]||'').toUpperCase()]||a[c.pos],
      mw:Number(a[c.mw])||0, pts:Number(a[c.pts])||0, note:parseNote(a[c.note]) });
  }
  if(!out.length) throw new Error('Keine Spieler in der CSV gefunden.');
  return out;
}
function parseMgrCsv(text){
  const lines = text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  const head = lines[0].split(';');
  const stIdx = []; // Spaltenindex -> Spieltagsnummer
  head.forEach((h,i)=>{ const m=String(h).trim().match(/^spieltag\s*(\d+)$/i); if(m) stIdx.push([i,+m[1]]); });
  if(!stIdx.length) throw new Error('Keine „Spieltag n“-Spalten gefunden.');
  const out={};
  for(let i=1;i<lines.length;i++){
    const a=lines[i].split(';');
    const name=String(a[0]||'').trim(); if(!name) continue;
    out[name]={};
    for(const [ci,st] of stIdx){ const v=String(a[ci]==null?'':a[ci]).trim(); if(v!=='' && !isNaN(+v)) out[name][st]=+v; }
  }
  return out;
}

/* ================= Spieler-Lookup (offizielle CSV) ================= */
let lookupCache = {};
function lookupPlayer(name){
  if(!PLAYERS.length) return null;
  const key=norm(name);
  if(key in lookupCache) return lookupCache[key];
  let hit = PLAYERS.filter(p=>norm(p.kurz)===key || norm(p.nachname)===key);
  if(hit.length!==1) { const h2=PLAYERS.filter(p=>norm(p.name)===key); if(h2.length===1) hit=h2; }
  const res = hit.length===1 ? hit[0] : null;
  lookupCache[key]=res; return res;
}

/* ================= Index / Ableitungen ================= */
function buildIndex(){
  lookupCache={};
  if(!SAISON){ IDX=null; return; }
  const managers=[]; const byMgr={};
  for(const r of SAISON.rows){
    if(!byMgr[r.manager]){ byMgr[r.manager]={rows:[]}; managers.push(r.manager); }
    byMgr[r.manager].rows.push(r);
  }
  let maxST=0;
  for(const r of SAISON.rows) for(const n in r.st) maxST=Math.max(maxST,+n);
  const sts=[]; for(let i=1;i<=maxST;i++) sts.push(i);
  // je Manager & ST: Starter, Bank, Startersumme
  for(const m of managers){
    const M=byMgr[m]; M.byST={};
    for(const st of sts){
      const starters=[], bench=[];
      for(const r of M.rows){ const e=r.st[st]; if(!e) continue; (e.r==='S'?starters:bench).push(r); }
      const sSum = starters.reduce((a,r)=>a+(r.st[st].p||0),0);
      M.byST[st]={starters,bench,sSum, played: starters.length>0};
    }
  }
  const color={}; managers.forEach((m,i)=>color[m]=COLORS[i%COLORS.length]);
  IDX={managers, byMgr, maxST, sts, color};
}
function mgrPts(m, st){
  if(MGRPTS && MGRPTS[m] && MGRPTS[m][st]!=null) return MGRPTS[m][st];
  const M=IDX.byMgr[m]; return (M && M.byST[st] && M.byST[st].played) ? M.byST[st].sSum : null;
}
function mgrTotal(m){ return IDX.sts.reduce((a,st)=>a+(mgrPts(m,st)||0),0); }
function bestXI(m, st){
  const M=IDX.byMgr[m]; if(!M||!M.byST[st]) return null;
  const avail = M.rows.filter(r=>r.st[st] && r.st[st].p!=null);
  const byPos={TOR:[],ABW:[],MFD:[],STU:[]};
  for(const r of avail) if(byPos[r.pos]) byPos[r.pos].push(r);
  for(const p of POSN) byPos[p].sort((a,b)=>b.st[st].p-a.st[st].p);
  let best=null;
  for(const f of FORMATIONS){
    const need={TOR:1,ABW:f[0],MFD:f[1],STU:f[2]};
    if(POSN.some(p=>byPos[p].length<need[p])) continue;
    let sum=0; const xi=[];
    for(const p of POSN) for(let i=0;i<need[p];i++){ sum+=byPos[p][i].st[st].p; xi.push(byPos[p][i]); }
    if(!best||sum>best.sum) best={sum,formation:f.join('-'),xi};
  }
  return best;
}
function realFormation(m, st){
  const M=IDX.byMgr[m]; if(!M.byST[st]||!M.byST[st].played) return null;
  const c={TOR:0,ABW:0,MFD:0,STU:0};
  M.byST[st].starters.forEach(r=>c[r.pos]!=null&&c[r.pos]++);
  return `${c.ABW}-${c.MFD}-${c.STU}`;
}

async function autoload(){
  if(location.protocol==='file:') return false;
  let changed=false;
  try{ const r=await fetch('saison.xlsx',{cache:'no-cache'});
    if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
      SAISON=parseSaisonXlsx(new Uint8Array(await r.arrayBuffer())); saveLS(LS.saison,SAISON); changed=true; }
  }catch(e){}
  try{ const r=await fetch('players-se.csv',{cache:'no-cache'});
    if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
      PLAYERS=parsePlayersCsv(await r.text()); saveLS(LS.players,PLAYERS); changed=true; }
  }catch(e){}
  try{ const r=await fetch('spieltagspunkte.csv',{cache:'no-cache'});
    if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
      MGRPTS=parseMgrCsv(await r.text()); saveLS(LS.mgr,MGRPTS); changed=true; }
  }catch(e){}
  try{ const r=await fetch('historie/manager.json',{cache:'no-cache'});
    if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
      const j=await r.json(); if(j&&j.namen&&j.saisons){ HISTORIE=j; changed=true; } }
  }catch(e){}
  try{ const r=await fetch('stats/saison.json',{cache:'no-cache'});
    if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
      const j=await r.json(); if(j&&j.spieler){ STATS=j; changed=true; } }
  }catch(e){}
  try{ const r=await fetch('clientdb.json',{cache:'no-cache'});
    if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
      const j=await r.json(); if(j&&j.matches&&j.teams){ CLIENTDB=j; changed=true; } }
  }catch(e){}
  for(const jahr of [2025,2024]){
    if(VORSAISON) break;
    try{ const r=await fetch('historie/players-'+jahr+'.csv',{cache:'no-cache'});
      if(r.ok && !/text\/html/.test(r.headers.get('content-type')||'')){
        VORSAISON={jahr, spieler:parsePlayersCsv(await r.text())}; changed=true; }
    }catch(e){}
  }
  return changed;
}

/* ================= SVG-Liniendiagramm ================= */
function lineChart(series, opts){
  const o=Object.assign({w:1000,h:300,invert:false,intTicks:false,noHide:false,xMax:null,
    versteckt:null,yFmt:v=>fmt(v)},opts||{});
  const weg = o.versteckt || hiddenSeries;
  const vis = o.noHide ? series : series.filter(s=>!weg.has(s.name));
  const pts = vis.flatMap(s=>s.values.filter(v=>v.y!=null));
  if(!pts.length) return '<div class="empty-note">Keine Daten.</div>';
  let yMin=Math.min(...pts.map(p=>p.y)), yMax=Math.max(...pts.map(p=>p.y));
  if(yMin===yMax){ yMin-=1; yMax+=1; }
  const xMax=o.xMax||IDX.maxST, padL=46,padR=14,padT=12,padB=26;
  const X=st=>padL+(st-1)/(Math.max(xMax-1,1))*(o.w-padL-padR);
  const Y=v=>{ const t=(v-yMin)/(yMax-yMin); const tt=o.invert?t:1-t; return padT+tt*(o.h-padT-padB); };
  let g='';
  const nT=5;
  for(let i=0;i<=nT;i++){
    const v=yMin+(yMax-yMin)*i/nT; const y=Y(v);
    g+=`<line x1="${padL}" y1="${y}" x2="${o.w-padR}" y2="${y}" stroke="#e5eaf2"/>`+
       `<text x="${padL-6}" y="${y+3}" font-size="10" fill="#6b7280" text-anchor="end">${o.yFmt(o.intTicks?Math.round(v):v)}</text>`;
  }
  const stSchritt=xMax>20?Math.ceil(xMax/17):1;   // bei 34 Spieltagen nicht jede Zahl schreiben
  for(let st=1;st<=xMax;st++) if(st===1||st===xMax||st%stSchritt===0)
    g+=`<text x="${X(st)}" y="${o.h-8}" font-size="10" fill="#6b7280" text-anchor="middle">${st}</text>`;
  for(const s of vis){
    const vp=s.values.filter(v=>v.y!=null);
    const d=vp.map((v,i)=>(i?'L':'M')+X(v.x).toFixed(1)+' '+Y(v.y).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`;
    g+=vp.map(v=>`<circle cx="${X(v.x).toFixed(1)}" cy="${Y(v.y).toFixed(1)}" r="3" fill="${s.color}"><title>${esc(s.name)} – ST ${v.x}: ${fmt(v.y)}</title></circle>`).join('');
  }
  return `<svg viewBox="0 0 ${o.w} ${o.h}" style="min-width:700px;width:100%">${g}</svg>`;
}

function stdev(a){ if(a.length<2) return null; const mu=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((x,y)=>x+(y-mu)**2,0)/(a.length-1)); }

function saisonEffizienz(m){
  let real=0,opt=0;
  for(const st of IDX.sts){ const D=IDX.byMgr[m].byST[st]; if(!D||!D.played) continue;
    const b=bestXI(m,st); if(!b) continue; real+=D.sSum; opt+=b.sum; }
  return opt?real/opt*100:null;
}

      <span class="mc-meta">${realFormation(m,kaderST)||''} · ST ${kaderST}: <b style="color:#e8b800">${fmt(D.sSum)}</b> Pkt</span></div>
      <div class="mc-body"><div class="pitch">${pitch}</div><div class="bench"><h4 style="margin-top:0;color:#1a3a6b">Bank</h4>${bench||'<div class="hint">leer</div>'}</div></div></div>`;
  }).join('');
  // Punkteherkunft
  const M=IDX.byMgr[herkunftMgr];
  const contrib=M.rows.map(r=>{
    let sum=0,n=0,sN=0,firstST=null,lastST=null;
    for(const st of IDX.sts){ const e=r.st[st]; if(!e) continue;
      if(firstST==null) firstST=st; lastST=st; n++;
      if(e.p!=null){ sum+=e.p; if(e.r==='S') sN+=e.p; } }
    return {r,sum,sN,n,firstST,lastST};
  }).sort((a,b)=>b.sum-a.sum);
  const total=contrib.reduce((a,c)=>a+c.sum,0);
  const starterTotal=contrib.reduce((a,c)=>a+c.sN,0);
  const mOpts=IDX.managers.map(m=>`<option ${m===herkunftMgr?'selected':''}>${esc(m)}</option>`).join('');
  const hkRows=contrib.map(c=>{
    let badge='';
    if(c.lastST<IDX.maxST) badge=' <span class="badge gone">abgegeben nach ST '+c.lastST+'</span>';
    else if(c.firstST>1) badge=' <span class="badge new">Neuzugang ab ST '+c.firstST+'</span>';
    return `<tr><td>${esc(c.r.spieler)}${badge}</td><td><span class="pos-chip pos-${c.r.pos}">${c.r.pos}</span></td>
      <td>${esc(c.r.verein)}</td><td class="num">${c.n}</td><td class="num"><b>${fmt(c.sum)}</b></td><td class="num">${fmt(c.sN)}</td></tr>`;
  }).join('');
  el.innerHTML =
   `<div class="card"><div class="selectors"><div class="selector-group"><label>Spieltag (Aufstellung)</label>
      <select onchange="kaderST=+this.value;renderKader()">${stOpts}</select></div>${kaderSelHtml}</div>
      <div class="kader-grid">${cards}</div></div>
    <div class="card"><h2>Punkteherkunft – woraus besteht das Saisonkonto?</h2>
      <div class="selectors"><div class="selector-group"><label>Manager</label><select onchange="herkunftMgr=this.value;renderKader()">${mOpts}</select></div></div>
      <table class="dt"><thead><tr><th>Spieler</th><th>Pos</th><th>Verein</th><th class="num">STs im Kader</th><th class="num">Punkte gesamt</th><th class="num">davon als Starter</th></tr></thead>
      <tbody>${hkRows}</tbody>
      <tfoot><tr><td colspan="4"><b>Summe (Kontrolle)</b></td><td class="num"><b>${fmt(total)}</b></td><td class="num"><b>${fmt(starterTotal)}</b></td></tr></tfoot></table>
      <div class="hint" style="margin-top:8px">„davon als Starter“ = Beitrag zum Managerkonto. Summe der Starterpunkte über alle Spieler = Saisonpunkte des Managers (inkl. inzwischen abgegebener Spieler).</div></div>`;
}

let versMgr=null;
function renderVerschenkt(){
  const el=document.getElementById('tab-verschenkt');
  if(!IDX){ el.innerHTML=emptyNote(); return; }
  if(!versMgr||!IDX.byMgr[versMgr]) versMgr=IDX.managers[0];
  const rows=IDX.managers.map(m=>{
    let real=0,opt=0;
    for(const st of IDX.sts){
      const D=IDX.byMgr[m].byST[st]; if(!D||!D.played) continue;
      const b=bestXI(m,st); if(!b) continue;
      real+=D.sSum; opt+=b.sum;
    }
    return {m,real,opt,diff:opt-real,eff:opt?real/opt*100:null};
  }).sort((a,b)=>b.eff-a.eff);
  const overview=rows.map((r,i)=>`<tr><td class="num">${i+1}.</td>
    <td><span class="color-dot" style="background:${IDX.color[r.m]}"></span>${esc(r.m)}</td>
    <td class="num">${fmt(r.real)}</td><td class="num">${fmt(r.opt)}</td>
    <td class="num ${r.diff>0?'bad':'good'}">${r.diff>0?'−':''}${fmt(r.diff)}</td>
    <td class="num"><b>${fmt(r.eff,1)} %</b></td></tr>`).join('');
  const mOpts=IDX.managers.map(m=>`<option ${m===versMgr?'selected':''}>${esc(m)}</option>`).join('');
  const det=IDX.sts.map(st=>{
    const D=IDX.byMgr[versMgr].byST[st]; if(!D||!D.played) return '';
    const b=bestXI(versMgr,st); if(!b) return '';
    const diff=b.sum-D.sSum;
    const missed=b.xi.filter(r=>r.st[st].r==='B').map(r=>`${esc(r.spieler)} (${r.pos}, ${fmt(r.st[st].p)})`).join(', ');
    return `<tr><td class="num">${st}</td><td class="num">${fmt(D.sSum)}</td>

  }).join('');

   `<div class="card"><h2>Aufstellungs-Effizienz (Saison)</h2>
      <div class="hint">Definition: Für jeden Spieltag wird die beste mögliche Elf aus dem eigenen Kader berechnet (alle Formationen: ${FORMATIONS.map(f=>f.join('-')).join(', ')}). Verschenkt = optimale minus tatsächliche Starterpunkte.</div>
      <table class="dt"><thead><tr><th class="num">#</th><th>Manager</th><th class="num">Echte Punkte</th><th class="num">Optimal möglich</th><th class="num">Verschenkt</th><th class="num">Effizienz</th></tr></thead><tbody>${overview}</tbody></table></div>
    <div class="card"><h2>Detail je Spieltag</h2>
      <div class="selectors"><div class="selector-group"><label>Manager</label><select onchange="versMgr=this.value;renderVerschenkt()">${mOpts}</select></div></div>
      <table class="dt"><thead><tr><th class="num">ST</th><th class="num">Echt</th><th>Formation</th><th class="num">Optimal</th><th>Opt. Formation</th><th class="num">Diff</th><th>Bankspieler, die in die beste Elf gehört hätten</th></tr></thead><tbody>${det}</tbody></table></div>`;
}

  const liga={}; for(const p of POSN){ const s=data.reduce((a,d)=>a+d.agg[p][0],0), n=data.reduce((a,d)=>a+d.agg[p][1],0); liga[p]=n?s/n:null; }

/* ================= Tab 6: Duelle & Rekorde ================= */
function renderDuelle(){
  const el=document.getElementById('tab-duelle');
  if(!IDX){ el.innerHTML=emptyNote(); return; }
  const ms=IDX.managers;
  const h2h=ms.map(a=>ms.map(b=>{
    if(a===b) return null;
    let w=0,l=0,d=0;
    for(const st of IDX.sts){ const va=mgrPts(a,st), vb=mgrPts(b,st);
      if(va==null||vb==null) continue;
      if(va>vb) w++; else if(va<vb) l++; else d++; }
    return {w,l,d};
  }));
  const short=m=>{ const p=m.split(/\s+/); return p.length>1 ? p[0][0]+'. '+p.slice(1).join(' ') : m; };
  const matrix='<table class="h2h"><tr><th></th>'+ms.map(m=>`<th title="${esc(m)}">${esc(short(m))}</th>`).join('')+'</tr>'+
    ms.map((a,i)=>'<tr><th class="rowh">'+esc(a)+'</th>'+ms.map((b,j)=>{
      if(i===j) return '<td class="self">·</td>';
      const c=h2h[i][j]; const cls=c.w>c.l?'win':(c.w<c.l?'loss':'draw');
      return `<td class="${cls}" title="${esc(a)} vs. ${esc(b)}: ${c.w} Siege, ${c.d} Remis, ${c.l} Niederlagen">${c.w}:${c.l}</td>`;
    }).join('')+'</tr>').join('')+'</table>';
  // Rekorde
  let hi=null, lo=null;
  const stWinners=[];
  for(const st of IDX.sts){
    let best=null;
    for(const m of ms){ const v=mgrPts(m,st); if(v==null) continue;
      if(!hi||v>hi.v) hi={m,st,v}; if(!lo||v<lo.v) lo={m,st,v};
      if(!best||v>best.v) best={m,st,v}; }
    if(best) stWinners.push(best);
  }
  // längste Serie an ST-Siegen
  let streak={m:null,len:0}, cur={m:null,len:0};
  for(const w of stWinners){
    if(w.m===cur.m) cur.len++; else cur={m:w.m,len:1};
    if(cur.len>streak.len) streak={...cur};
  }
  // Spieler des Spieltags
  const potd=IDX.sts.map(st=>{
    let best=null;
    for(const m of ms){ const D=IDX.byMgr[m].byST[st]; if(!D) continue;
      for(const r of D.starters){ const p=r.st[st].p; if(p!=null&&(!best||p>best.p)) best={st,m,r,p}; } }
    return best;
  }).filter(Boolean);
  const potdRows=potd.map(b=>`<tr><td class="num">${b.st}</td><td>${esc(b.r.spieler)}</td>
    <td><span class="pos-chip pos-${b.r.pos}">${b.r.pos}</span></td><td>${esc(b.m)}</td><td class="num"><b>${fmt(b.p)}</b></td></tr>`).join('');
  el.innerHTML =
   `<div class="card"><h2>Head-to-Head – wer schlägt wen?</h2>
      <div class="hint">Zeile gegen Spalte: Siege:Niederlagen über alle Spieltage (Hover für Details).</div>
      <div class="h2h-wrap">${matrix}</div></div>
    <div class="card"><h2>Hall of Fame</h2>
      <table class="dt"><tbody>
        <tr><td>🏆 Höchste Spieltagswertung</td><td>${hi?esc(hi.m)+' – <b>'+fmt(hi.v)+'</b> Punkte (ST '+hi.st+')':'–'}</td></tr>
        <tr><td>🥶 Niedrigste Spieltagswertung</td><td>${lo?esc(lo.m)+' – <b>'+fmt(lo.v)+'</b> Punkte (ST '+lo.st+')':'–'}</td></tr>
        <tr><td>🔥 Längste Spieltagssieg-Serie</td><td>${streak.m?esc(streak.m)+' – <b>'+streak.len+'</b> Spieltage in Folge':'–'}</td></tr>
      </tbody></table></div>
    <div class="card"><h2>Spieler des Spieltags</h2>
      <table class="dt"><thead><tr><th class="num">ST</th><th>Spieler</th><th>Pos</th><th>Manager</th><th class="num">Punkte</th></tr></thead><tbody>${potdRows}</tbody></table></div>`;
}

/* ================= Tab 7: Analyse =================
   Sechs Auswertungen zur Kaderzusammenstellung. Jede sagt selbst, ab wann sie trägt. */

/* Hilfsmittel */
const mittel=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const stdabw=a=>{ if(a.length<2) return null; const m=mittel(a);
  return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)); };
function statsNachId(){
  const m=new Map(); if(STATS) for(const s of STATS.spieler) if(s.kid) m.set(s.kid,s);
  return m;
}
/* Kicker-Spieler nach normalisiertem Namen, für den Abgleich mit der Excel */
function spielerFinden(name,verein){
  const k=norm(name);
  const treffer=PLAYERS.filter(p=>norm(p.kurz)===k||norm(p.nachname)===k||norm(p.name)===k);
  if(treffer.length===1) return treffer[0];
  const mv=treffer.filter(p=>p.verein===verein);
  return mv.length===1?mv[0]:null;
}
const anzahlST=()=>STATS?STATS.spieltage.length:0;
function hinweisAb(n,was){
  return `<div class="pending-note">Trägt ab etwa <b>${n} Spieltagen</b> — aktuell ${anzahlST()}.
    ${was}</div>`;
}

/* --- 1. Differenzspieler ------------------------------------------------- */
function analyseDifferenz(){
  if(!IDX||!SAISON) return '<div class="empty-note">Keine Kaderdaten.</div>';
  const anzMgr=IDX.managers.length;
  const besitz=new Map();     // Spielername -> Set(Manager)
  for(const r of SAISON.rows){
    if(!r.st[IDX.maxST]) continue;             // aktueller Kaderstand
    const key=r.spieler;
    if(!besitz.has(key)) besitz.set(key,{pos:r.pos,verein:r.verein,mgr:new Set()});
    besitz.get(key).mgr.add(r.manager);
  }
  const sm=statsNachId();
  const zeilen=[...besitz.entries()].map(([name,o])=>{
    const p=spielerFinden(name,o.verein);
    const s=p?sm.get(p.id):null;
    const punkte=p?p.pts:0;
    const quote=o.mgr.size/anzMgr;
    return {name,pos:o.pos,verein:o.verein,besitzer:o.mgr.size,mgr:[...o.mgr],
      punkte, vorteil:punkte*(1-quote), quote};
  }).filter(z=>z.punkte>0).sort((a,b)=>b.vorteil-a.vorteil);

  const exklusiv=zeilen.filter(z=>z.besitzer===1).slice(0,12);
  const breit=zeilen.slice().sort((a,b)=>b.besitzer-a.besitzer||b.punkte-a.punkte).slice(0,10);

  const tab=(rows,mitMgr)=>`<table class="dt"><thead><tr><th>Spieler</th><th>Pos</th><th>Verein</th>
    <th class="num">Besitzer</th><th class="num">Punkte</th><th class="num">Vorteilswert</th>
    ${mitMgr?'<th>Manager</th>':''}</tr></thead><tbody>`+
    rows.map(z=>`<tr><td><b>${esc(z.name)}</b></td>
      <td><span class="pos-chip pos-${z.pos}">${z.pos}</span></td><td>${esc(z.verein)}</td>
      <td class="num">${z.besitzer} von ${anzMgr}</td><td class="num">${fmt(z.punkte)}</td>
      <td class="num"><b class="${z.vorteil>z.punkte*0.7?'good':''}">${fmt(z.vorteil)}</b></td>
      ${mitMgr?'<td style="white-space:normal">'+z.mgr.map(esc).join(', ')+'</td>':''}</tr>`).join('')+
    '</tbody></table>';

  return `<div class="hint">Ein Spieler, den alle haben, bringt im Rennen nichts — alle gewinnen
      gleichzeitig. Der <b>Vorteilswert</b> misst das: <code>Punkte × (1 − Besitzquote)</code>.<br>
      <b>Datenbasis: laufende Saison</b> — Punkte aus <code>players-se.csv</code>,
      Kaderstand nach Spieltag ${IDX.maxST} aus <code>saison.xlsx</code>.</div>
    <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 8px">
      Exklusiv-Trümpfe — nur ein Manager hat sie</h4>${tab(exklusiv,true)}
    <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:20px 0 8px">
      Gegenteil: von vielen besetzt, dadurch neutralisiert</h4>${tab(breit,false)}`;
}

/* --- 2. Z-Score je Position ---------------------------------------------- */
let zBasis='vorsaison';
function analyseZScore(){
  const laufendOk=PLAYERS.length&&PLAYERS.some(p=>p.pts>0);
  if(zBasis==='laufend'&&!laufendOk) zBasis='vorsaison';
  const nutzeVor=zBasis==='vorsaison'&&VORSAISON;
  const quelle=nutzeVor?VORSAISON.spieler:PLAYERS;
  if(!quelle||!quelle.length) return '<div class="empty-note">Keine Spielerdaten.</div>';
  const jahr=nutzeVor?VORSAISON.jahr:null;
  const umschalter=`<div class="selectors" style="margin-bottom:12px">
    <div class="selector-group"><label>Datenbasis</label>
      <select onchange="zBasis=this.value;renderAnalyse()">
        <option value="vorsaison" ${zBasis==='vorsaison'?'selected':''}>
          Vorsaison ${VORSAISON?VORSAISON.jahr+'/'+String(VORSAISON.jahr+1).slice(2):''} — volle 34 Spieltage</option>
        <option value="laufend" ${zBasis==='laufend'?'selected':''}>
          laufende Saison — ${anzahlST()} Spieltag${anzahlST()===1?'':'e'}</option>
      </select></div></div>`;
  const nachPos={};
  for(const p of quelle){
    if(!POSN.includes(p.pos)||!(p.pts>0)) continue;
    (nachPos[p.pos]=nachPos[p.pos]||[]).push(p);
  }
  const kennz={};
  for(const pos of POSN){
    const a=(nachPos[pos]||[]).map(p=>p.pts);
    kennz[pos]={n:a.length, m:mittel(a)||0, sd:stdabw(a)||1};
  }
  const alle=[];
  for(const pos of POSN) for(const p of (nachPos[pos]||[]))
    alle.push({...p, z:(p.pts-kennz[pos].m)/kennz[pos].sd});
  alle.sort((a,b)=>b.z-a.z);

  const kacheln=POSN.map(pos=>`<div class="tile"><div class="lbl">${POSLABEL[pos]}</div>
    <div class="val">${fmt(kennz[pos].m,1)}<small> Ø · σ ${fmt(kennz[pos].sd,1)}</small></div></div>`).join('');

  const top=alle.slice(0,20).map((p,i)=>`<tr><td class="num">${i+1}.</td>
    <td><b>${esc(p.kurz)}</b></td><td><span class="pos-chip pos-${p.pos}">${p.pos}</span></td>
    <td>${esc(p.verein)}</td><td class="num">${fmt(p.pts)}</td>
    <td class="num"><b class="${p.z>2?'good':''}">+${fmt(p.z,2)}</b></td>
    <td class="num">${p.mw?fmt(p.mw/1e6,1)+' M€':'–'}</td></tr>`).join('');

  // grösster Hebel: wo ist der Abstand zwischen Top und Positionsdurchschnitt am grössten
  const hebel=POSN.map(pos=>{
    const beste=(nachPos[pos]||[]).slice().sort((a,b)=>b.pts-a.pts).slice(0,3);
    return {pos, vorsprung:beste.length?mittel(beste.map(p=>p.pts))-kennz[pos].m:0,
      inSd:beste.length?(mittel(beste.map(p=>p.pts))-kennz[pos].m)/kennz[pos].sd:0,
      namen:beste.map(p=>p.kurz).join(', ')};
  }).sort((a,b)=>b.inSd-a.inSd);

  return `<div class="hint">Ein Abwehrspieler mit 6 Punkten kann wertvoller sein als ein Stürmer
      mit 7 — entscheidend ist der Abstand zum <b>Durchschnitt seiner Position</b>.
      Der Z-Wert misst ihn in Standardabweichungen: +2,0 heisst zwei σ über dem Positionsschnitt.</div>
    ${umschalter}
    <div class="${jahr?'pending-note':'hint'}" style="margin-bottom:12px">${jahr
      ? `<b>Datenbasis: abgeschlossene Saison ${jahr}/${String(jahr+1).slice(2)}</b>, nicht die laufende.
         34 Spieltage sind als Positionsmassstab weit belastbarer als ${anzahlST()}
         — die Rangfolge zeigt aber die Form von <i>damals</i>. Ab etwa Spieltag 10 lohnt der Wechsel.`
      : `<b>Datenbasis: laufende Saison</b>, ${anzahlST()} Spieltag${anzahlST()===1?'':'e'}.
         Aktuell, aber bei wenigen Spieltagen stark vom Zufall geprägt.`}</div>
    <div class="tiles" style="margin:14px 0">${kacheln}</div>
    <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px">
      Grösster Hebel — wo lohnt ein Spitzenspieler am meisten</h4>
    <table class="dt"><thead><tr><th>Position</th><th class="num">Vorsprung der Top 3</th>
      <th class="num">in σ</th><th>Spieler</th></tr></thead><tbody>`+
      hebel.map(h=>`<tr><td><span class="pos-chip pos-${h.pos}">${h.pos}</span> ${POSLABEL[h.pos]}</td>
        <td class="num">+${fmt(h.vorsprung)}</td><td class="num"><b>${fmt(h.inSd,2)}</b></td>
        <td>${esc(h.namen)}</td></tr>`).join('')+
    `</tbody></table>
    <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:20px 0 8px">
      Top 20 nach Z-Wert</h4>
    <table class="dt"><thead><tr><th class="num">#</th><th>Spieler</th><th>Pos</th><th>Verein</th>
      <th class="num">Punkte</th><th class="num">Z-Wert</th><th class="num">Marktwert</th></tr></thead>
      <tbody>${top}</tbody></table>`;
}

/* --- 3. Torhüter: verhinderte Tore --------------------------------------- */
function analyseTorhueter(){
  if(!STATS) return '<div class="empty-note">Keine Leistungsdaten geladen.</div>';
  const tw=STATS.spieler.filter(s=>s.paraden!=null&&s.minuten>0)
    .map(s=>({...s, verhindert:(s.xgoalsGegen||0)-(s.gegentore||0)}))
    .sort((a,b)=>b.verhindert-a.verhindert);
  if(!tw.length) return '<div class="empty-note">Keine Torhüterdaten.</div>';
  const zeilen=tw.map((s,i)=>`<tr><td class="num">${i+1}.</td><td><b>${esc(s.kurz)}</b></td>
    <td>${esc(s.verein)}</td><td class="num">${s.einsaetze}</td>
    <td class="num">${fmt(s.gegentore)}</td><td class="num">${fmt(s.xgoalsGegen,2)}</td>
    <td class="num"><b class="${s.verhindert>0.3?'good':(s.verhindert<-0.3?'bad':'')}">
      ${s.verhindert>0?'+':''}${fmt(s.verhindert,2)}</b></td>
    <td class="num">${fmt(s.paraden)}</td><td class="num">${fmt(s.abgewehrteBaelleQuote)} %</td></tr>`).join('');
  return `<div class="hint">Kicker-Punkte bestrafen einen Torhüter für die Abwehr vor ihm.
      <b>Verhinderte Tore</b> = erwartete Gegentore (xGoals conceded) minus tatsächliche.
      Ein positiver Wert heisst: Er hielt mehr, als die Chancenqualität hergab — unabhängig
      vom Ergebnis. Der unterbewertete Keeper hinter einer schwachen Abwehr steht hier oben.<br>
      <b>Datenbasis: laufende Saison</b> (${STATS?STATS.saison:'–'}), Spieltag
      ${STATS&&STATS.spieltage.length?STATS.spieltage.join(', '):'–'} — aus den gesammelten
      Kicker-Spieldaten.</div>
    ${anzahlST()<6?hinweisAb(6,'Bei wenigen Spielen entscheidet eine einzelne Grosschance.'):''}
    <table class="dt" style="margin-top:12px"><thead><tr><th class="num">#</th><th>Torhüter</th>
      <th>Verein</th><th class="num">Sp.</th><th class="num">Gegentore</th><th class="num">erwartet</th>
      <th class="num">verhindert</th><th class="num">Paraden</th><th class="num">Quote</th></tr></thead>
      <tbody>${zeilen}</tbody></table>`;
}

/* --- 4. Konstanz ---------------------------------------------------------- */
function analyseKonstanz(){
  if(!IDX) return '<div class="empty-note">Keine Daten.</div>';
  const sts=IDX.sts.filter(st=>IDX.managers.some(m=>mgrPts(m,st)!=null));
  const zeilen=IDX.managers.map(m=>{
    const p=sts.map(st=>mgrPts(m,st)).filter(v=>v!=null);
    return {m, n:p.length, schnitt:mittel(p), sd:stdabw(p), best:Math.max(...p,0), schlecht:Math.min(...p,0)};
  }).filter(z=>z.n>0).sort((a,b)=>(b.schnitt||0)-(a.schnitt||0));

  const vk=z=>z.sd&&z.schnitt?z.sd/z.schnitt:null;   // Variationskoeffizient
  const tabelle=zeilen.map(z=>`<tr>
    <td><span class="color-dot" style="background:${IDX.color[z.m]}"></span>${esc(z.m)}</td>
    <td class="num">${z.n}</td><td class="num"><b>${fmt(z.schnitt,1)}</b></td>
    <td class="num">${z.sd==null?'–':fmt(z.sd,1)}</td>
    <td class="num">${vk(z)==null?'–':fmt(vk(z)*100,0)+' %'}</td>
    <td class="num">${fmt(z.best)}</td><td class="num">${fmt(z.schlecht)}</td></tr>`).join('');

  // Spielstrategie: wer zurückliegt, braucht Varianz
  const stand=IDX.managers.map(m=>({m,total:mgrTotal(m)})).sort((a,b)=>b.total-a.total);
  const fuehrend=stand[0], rest=IDX.sts.length-Math.max(...IDX.sts.filter(st=>
    IDX.managers.some(m=>mgrPts(m,st)!=null)),0);
  const strategie=stand.map((s,i)=>{
    const rueck=fuehrend.total-s.total;
    return {m:s.m, platz:i+1, rueck,
      rat:i===0?'Varianz senken — verlässliche Spieler, keine Experimente'
        :rueck<40?'neutral — Kurs halten'
        :'Varianz erhöhen — Differenzspieler statt sicherer Bank'};
  });

  return `<div class="hint">Der <b>Variationskoeffizient</b> setzt die Streuung ins Verhältnis zum
      Schnitt: klein = verlässlich, gross = Achterbahn. Beides kann richtig sein — je nachdem,
      wo man steht.</div>
    ${anzahlST()<8?hinweisAb(8,'Streuungsmasse brauchen Spieltage, sonst misst man Zufall.'):''}
    <table class="dt" style="margin-top:12px"><thead><tr><th>Manager</th><th class="num">Sp.</th>
      <th class="num">Schnitt</th><th class="num">Streuung σ</th><th class="num">rel. Streuung</th>
      <th class="num">bester</th><th class="num">schlechtester</th></tr></thead><tbody>${tabelle}</tbody></table>
    <h4 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:20px 0 8px">
      Was daraus folgt</h4>
    <div class="hint" style="margin-bottom:8px">Wer deutlich zurückliegt, gewinnt nicht mit dem
      Ligadurchschnitt — er braucht Streuung. Wer führt, will sie vermeiden. Das ist keine
      Meinung, sondern folgt daraus, dass nur der erste Platz zählt.</div>
    <table class="dt"><thead><tr><th class="num">Platz</th><th>Manager</th>
      <th class="num">Rückstand</th><th>Empfehlung</th></tr></thead><tbody>`+
    strategie.map(s=>`<tr><td class="num">${s.platz}.</td>
      <td><span class="color-dot" style="background:${IDX.color[s.m]}"></span>${esc(s.m)}</td>
      <td class="num">${s.rueck?fmt(s.rueck):'–'}</td><td>${s.rat}</td></tr>`).join('')+
    '</tbody></table>';
}

/* --- 5. Spielplan --------------------------------------------------------- */
let planFenster=5;
function analyseSpielplan(){
  if(!CLIENTDB) return '<div class="empty-note">clientdb.json nicht geladen.</div>';
  const teamName={}; CLIENTDB.teams.forEach(t=>teamName[t.id]=t.name);
  const kurz={}; CLIENTDB.teams.forEach(t=>kurz[t.id]=t.shortName||t.name);

  // Vereinsstärke aus der abgeschlossenen Vorsaison: Punkte je Spieler
  const staerke={};
  if(VORSAISON){
    const proVerein={};
    for(const p of VORSAISON.spieler) if(p.pts>0) (proVerein[p.verein]=proVerein[p.verein]||[]).push(p.pts);
    const alleWerte=Object.values(proVerein).flat();
    const ligaM=mittel(alleWerte)||0;
    for(const t of CLIENTDB.teams){
      const a=proVerein[t.name];
      staerke[t.id]=a&&a.length>=8?mittel(a):ligaM;    // Aufsteiger ohne Historie: Ligaschnitt
    }
  }
  const werte=Object.values(staerke);
  const sM=mittel(werte)||1, sSd=stdabw(werte)||1;
  const zScore=id=>staerke[id]==null?0:(staerke[id]-sM)/sSd;

  // aktueller Spieltag = erster ohne Ergebnis
  const startST=(anzahlST()||0)+1;
  const naechste=[];
  for(let st=startST;st<startST+planFenster&&st<=34;st++) naechste.push(st);

  const rundeId=st=>'rn-k00012026'+String(st).padStart(4,'0');
  const zeilen=CLIENTDB.teams.map(t=>{
    const gegner=naechste.map(st=>{
      const m=CLIENTDB.matches.find(x=>x.roundId===rundeId(st)&&
        (x.homeTeamId===t.id||x.guestTeamId===t.id));
      if(!m) return null;
      const heim=m.homeTeamId===t.id;
      const gid=heim?m.guestTeamId:m.homeTeamId;
      return {st, gid, heim, z:zScore(gid)};
    }).filter(Boolean);
    // leichter Spielplan = schwache Gegner (niedriger z) + Heimspiele
    const schwere=mittel(gegner.map(g=>g.z-(g.heim?0.15:0)))||0;
    return {t, gegner, schwere, eigen:zScore(t.id)};
  }).sort((a,b)=>a.schwere-b.schwere);

  const kopf=naechste.map(st=>`<th class="num">ST ${st}</th>`).join('');
  const zellen=z=>z.gegner.map(g=>{
    const farbe=g.z<-0.6?'#dcfce7':g.z<0.2?'#fef9c3':'#fee2e2';
    return `<td style="background:${farbe};white-space:nowrap" title="${esc(teamName[g.gid])} ${g.heim?'(H)':'(A)'}">
      ${esc(kurz[g.gid])}<br><span class="hint">${g.heim?'H':'A'}</span></td>`;
  }).join('');

  return `<div class="hint">Wie schwer sind die nächsten <b>${planFenster} Spieltage</b> für jeden Verein?
      Gegnerstärke aus der Vorsaison${VORSAISON?` (${VORSAISON.jahr}/${String(VORSAISON.jahr+1).slice(2)})`:''},
      Heimvorteil eingerechnet. <span style="background:#dcfce7;padding:1px 5px;border-radius:4px">leicht</span>
      <span style="background:#fef9c3;padding:1px 5px;border-radius:4px">mittel</span>
      <span style="background:#fee2e2;padding:1px 5px;border-radius:4px">schwer</span> —
      oben stehen die Vereine, deren Spieler es am leichtesten haben.
      ${!VORSAISON?'<b>Ohne historie/players-*.csv ist die Gegnerstärke neutral</b> — mit <code>node fetch-historie.js</code> erzeugen.':''}</div>
    <div class="selectors" style="margin:12px 0"><div class="selector-group"><label>Zeitraum</label>
      <select onchange="planFenster=+this.value;renderAnalyse()">
        ${[3,5,8].map(n=>`<option value="${n}" ${n===planFenster?'selected':''}>nächste ${n} Spieltage</option>`).join('')}
      </select></div></div>
    <div class="h2h-wrap"><table class="h2h"><tr><th class="rowh">Verein</th>${kopf}<th class="num">Schwere</th></tr>`+
      zeilen.map(z=>`<tr><th class="rowh">${esc(z.t.name)}</th>${zellen(z)}
        <td class="num"><b>${z.schwere>0?'+':''}${fmt(z.schwere,2)}</b></td></tr>`).join('')+
    '</table></div>';
}

/* ================= Tab 8: Historie =================
   Sechs Saisons Spreeliga aus historie/manager.json. Zeigt, wo ein Manager im
   Schnitt an einem Spieltag steht — bewusst als Einordnung, nicht als Beweis:
   hinter jedem Punkt der Spieltagskurve stehen nur so viele Werte wie Saisons. */
const HIST_FARBEN=['#1a3a6b','#e8b800','#dc2626','#16a34a','#7c3aed','#ea580c','#0891b2','#be185d','#4d7c0f'];
let histAnsicht='kumuliert', histBasis='punkte', histSaison='alle', histGlatt=5;
const histVersteckt=new Set();
function histToggle(n){ histVersteckt.has(n)?histVersteckt.delete(n):histVersteckt.add(n); renderHistorie(); }

function histReihen(){
  if(!HISTORIE) return null;
  const {namen,saisons}=HISTORIE;
  const jahre=histSaison==='alle'?Object.keys(saisons):[histSaison];
  // je Manager und Spieltag: Werte über die gewählten Saisons sammeln
  const roh={}; namen.forEach(n=>roh[n]=Array.from({length:35},()=>[]));
  for(const j of jahre){
    const sp=saisons[j]; if(!sp) continue;
    for(const [st,zeilen] of Object.entries(sp)){
      const schnitt=zeilen.reduce((a,z)=>a+z[1],0)/zeilen.length;
      for(const z of zeilen){
        const wert=histBasis==='relativ'?(schnitt?z[1]/schnitt:null):z[1];
        if(wert!=null) roh[namen[z[0]]][+st].push(wert);
      }
    }
  }
  const mw=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const aktiv=namen.filter(n=>roh[n].some(a=>a.length));
  return aktiv.map((n,i)=>{
    const farbe=HIST_FARBEN[namen.indexOf(n)%HIST_FARBEN.length];
    const werte=[]; let summe=0, hatte=false;
    for(let st=1;st<=34;st++){
      const m=mw(roh[n][st]);
      if(histAnsicht==='kumuliert'){
        if(m!=null){ summe+=m; hatte=true; }
        werte.push({x:st,y:hatte?Math.round(summe*100)/100:null});
      } else werte.push({x:st,y:m==null?null:Math.round(m*100)/100});
    }
    // gleitender Durchschnitt für die Spieltagsansicht — macht die Kurve lesbar,
    // ohne mehr Genauigkeit zu behaupten als vorhanden ist
    if(histAnsicht==='spieltag' && histGlatt>1){
      const roh2=werte.map(v=>v.y);
      const halb=Math.floor(histGlatt/2);
      for(let i=0;i<werte.length;i++){
        const fenster=roh2.slice(Math.max(0,i-halb),i+halb+1).filter(v=>v!=null);
        werte[i].y=fenster.length?Math.round(fenster.reduce((a,b)=>a+b,0)/fenster.length*100)/100:null;
      }
    }
    return {name:n,color:farbe,values:werte,
      saisons:new Set(jahre.filter(j=>saisons[j]&&Object.values(saisons[j]).some(z=>z.some(x=>namen[x[0]]===n)))).size};
  });
}

function renderHistorie(){
  const el=document.getElementById('tab-historie');
  if(!HISTORIE){
    el.innerHTML='<div class="card"><div class="empty-note">Noch keine Historie geladen.<br>'+
      '<span class="hint">Mit <code>node fetch-historie.js</code> erzeugen — die Datei '+
      '<code>historie/manager.json</code> wird dann automatisch gelesen.</span></div></div>';
    return;
  }
  const reihen=histReihen();
  const jahre=Object.keys(HISTORIE.saisons).sort();
  const sOpts=['<option value="alle">Alle Saisons</option>'].concat(
    jahre.map(j=>`<option value="${j}" ${j===histSaison?'selected':''}>${j}/${String(+j+1).slice(2)}</option>`)).join('');

  // Gesamtrangliste relativ zum Ligaschnitt
  const rang=(()=>{
    const acc={};
    for(const [j,sp] of Object.entries(HISTORIE.saisons)){
      if(histSaison!=='alle'&&j!==histSaison) continue;
      for(const zeilen of Object.values(sp)){
        const sch=zeilen.reduce((a,z)=>a+z[1],0)/zeilen.length; if(!sch) continue;
        for(const z of zeilen){ const n=HISTORIE.namen[z[0]];
          (acc[n]=acc[n]||[]).push(z[1]/sch); }
      }
    }
    const mw=a=>a.reduce((x,y)=>x+y,0)/a.length;
    const sd=a=>{const m=mw(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/Math.max(1,a.length-1));};
    return Object.entries(acc).map(([n,a])=>({n,st:a.length,rel:mw(a),se:sd(a)/Math.sqrt(a.length)}))
      .sort((x,y)=>y.rel-x.rel);
  })();

  const legende='<div class="legend">'+reihen.map(s=>
    `<span class="${histVersteckt.has(s.name)?'off':''}" onclick="histToggle('${esc(s.name).replace(/'/g,"\\'")}')">`+
    `<span class="color-dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')+'</div>';

  const einheit=histBasis==='relativ'?'':' Pkt';
  el.innerHTML=
   `<div class="card"><h2>Sechs Saisons Spreeliga</h2>
      <div class="hint">Aus <code>historie/manager.json</code> — ${jahre.length} Saisons,
        ${jahre[0]}/${String(+jahre[0]+1).slice(2)} bis ${jahre[jahre.length-1]}/${String(+jahre[jahre.length-1]+1).slice(2)}.
        Die Kurven zeigen den <b>Durchschnitt über die gewählten Saisons</b>.</div>
      <div class="selectors">
        <div class="selector-group"><label>Ansicht</label>
          <select onchange="histAnsicht=this.value;renderHistorie()">
            <option value="kumuliert" ${histAnsicht==='kumuliert'?'selected':''}>Kumuliert über die Saison</option>
            <option value="spieltag" ${histAnsicht==='spieltag'?'selected':''}>Schnitt je Spieltag</option>
          </select></div>
        <div class="selector-group"><label>Basis</label>
          <select onchange="histBasis=this.value;renderHistorie()">
            <option value="punkte" ${histBasis==='punkte'?'selected':''}>Punkte</option>
            <option value="relativ" ${histBasis==='relativ'?'selected':''}>Relativ zum Ligaschnitt</option>
          </select></div>
        <div class="selector-group"><label>Saison</label>
          <select onchange="histSaison=this.value;renderHistorie()">${sOpts}</select></div>
        ${histAnsicht==='spieltag'?`<div class="selector-group"><label>Glättung</label>
          <select onchange="histGlatt=+this.value;renderHistorie()">
            <option value="1" ${histGlatt===1?'selected':''}>ohne (Rohwerte)</option>
            <option value="5" ${histGlatt===5?'selected':''}>5 Spieltage</option>
            <option value="9" ${histGlatt===9?'selected':''}>9 Spieltage</option>
          </select></div>`:''}
      </div>
      <div class="chart-wrap">${lineChart(reihen,{xMax:34,h:340,versteckt:histVersteckt,
        yFmt:v=>histBasis==='relativ'?v.toFixed(2):fmt(Math.round(v))})}</div>
      ${legende}
      <div class="hint" style="margin-top:10px">${
        histAnsicht==='kumuliert'
        ? 'Kumuliert: der durchschnittliche Punktestand nach Spieltag n. Zeigt, wie sich der Abstand über eine Saison typischerweise aufbaut.'
        : 'Je Spieltag: hinter jedem Punkt stehen nur '+(histSaison==='alle'?jahre.length:1)+
          ' Wert'+((histSaison==='alle'&&jahre.length>1)?'e':'')+
          (histGlatt>1?', geglättet über '+histGlatt+' Spieltage':'')+
          ' — Ausschläge sind Zufall, nicht Form. Zur Einordnung gedacht, nicht als Beleg.'}</div></div>

    <div class="card"><h2>Rangliste ${histSaison==='alle'?'über alle Saisons':histSaison+'/'+String(+histSaison+1).slice(2)}</h2>
      <div class="hint">Relativ zum Ligaschnitt des jeweiligen Spieltags — 1,00 = Ligadurchschnitt.
        Das gleicht aus, dass manche Spieltage ligaweit mehr Punkte abwerfen, und macht Saisons
        mit 7, 9 oder 11 Managern vergleichbar.</div>
      <table class="dt"><thead><tr><th class="num">#</th><th>Manager</th>
        <th class="num">Spieltage</th><th class="num">Relativwert</th><th class="num">± Fehler</th></tr></thead><tbody>`+
      rang.map((r,i)=>`<tr><td class="num">${i+1}.</td>
        <td><span class="color-dot" style="background:${HIST_FARBEN[HISTORIE.namen.indexOf(r.n)%HIST_FARBEN.length]}"></span>${esc(r.n)}</td>
        <td class="num">${r.st}</td>
        <td class="num"><b class="${r.rel>1?'good':(r.rel<1?'bad':'')}">${r.rel.toFixed(3)}</b></td>
        <td class="num">${r.se.toFixed(3)}</td></tr>`).join('')+
      `</tbody></table>
      <div class="hint" style="margin-top:8px">Zwei Manager sind erst dann sicher zu trennen, wenn ihr
        Abstand grösser ist als etwa die Summe ihrer Fehlerwerte. Die Spitzengruppe liegt eng beieinander.</div></div>`;
}

/* ================= Start ================= */
(async function init(){
  if(IMPORT_MODE){
    document.getElementById('hdrActions').style.display='flex';
    document.getElementById('pageFooter').innerHTML =
      'Pflege-Modus (?import): Saison-Excel (Blatt „Kader“: Manager | Spieler | Verein | Position | ST&lt;n&gt; Punkte | ST&lt;n&gt; Rolle) · '+
      'offizielle Kicker-Spieler-CSV · optional Spieltagspunkte.csv.<br>'+
      'Dateien als <code>saison.xlsx</code>, <code>players-se.csv</code>, <code>spieltagspunkte.csv</code> neben der HTML werden automatisch geladen.';
    SAISON=loadLS(LS.saison); PLAYERS=loadLS(LS.players)||[]; MGRPTS=loadLS(LS.mgr);
  }
  buildIndex(); renderAll();
  const changed=await autoload();
  AUTOLOAD_DONE=true;
  if(changed || !IMPORT_MODE){ buildIndex(); renderAll(); }
})();
</script>
