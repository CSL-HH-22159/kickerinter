<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lukas Hechmann – Kader · KickerInter</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07101e;--bg2:#0d1b2d;--card:#0f2035;--border:#1a3050;
  --blue:#2563eb;--blue-light:#3b82f6;--blue-muted:#1e3a5f;
  --gold:#f5c518;--text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

/* Header */
.site-header{display:flex;align-items:center;gap:14px;padding:18px 40px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100;}
.header-center-logo{position:absolute;left:50%;transform:translateX(-50%);height:100px;width:auto;filter:drop-shadow(0 0 14px rgba(56,152,255,.3));pointer-events:none;}
.site-logo{height:100px;width:auto;}
.header-nav{margin-left:auto;display:flex;gap:8px;}
.nav-link{color:var(--muted2);text-decoration:none;font-size:.82rem;font-weight:500;padding:6px 14px;border-radius:20px;border:1px solid var(--border);transition:all .2s;background:rgba(13,27,45,.6);}
.nav-link:hover{color:var(--text);border-color:var(--blue-light);background:var(--blue-muted);}

/* Page */
.page{max-width:900px;margin:0 auto;padding:48px 24px 80px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);text-decoration:none;margin-bottom:28px;transition:color .2s;}
.back-link:hover{color:var(--blue-light);}

/* Manager hero */
.mgr-hero{display:flex;align-items:center;gap:24px;margin-bottom:36px;}
.mgr-avatar-wrap{flex-shrink:0;position:relative;}
.mgr-avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--border);display:block;}
.mgr-info{}
.mgr-season{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:4px;}
.mgr-name{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-bottom:10px;}
.mgr-tags{display:flex;gap:8px;flex-wrap:wrap;}
.mgr-tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 10px;color:var(--muted2);}

/* Placeholder */
.placeholder-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:40px 32px;text-align:center;color:var(--muted2);}
.placeholder-box .ph-icon{font-size:2.5rem;margin-bottom:14px;}
.placeholder-box .ph-title{font-size:1rem;font-weight:700;margin-bottom:8px;color:var(--text);}
.placeholder-box .ph-sub{font-size:.84rem;line-height:1.7;}

/* Nav */
.pn-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:24px;border-top:1px solid var(--border);}
.pn-link{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);text-decoration:none;padding:8px 18px;border:1px solid var(--border);border-radius:20px;background:rgba(13,27,45,.6);transition:all .2s;}
.pn-link:hover{color:var(--text);border-color:var(--blue-light);background:var(--blue-muted);}
.pn-dis{opacity:.3;cursor:default;}
.pn-center{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}

/* Footer */
footer{background:var(--bg);border-top:1px solid var(--border);padding:28px 24px;text-align:center;color:var(--muted);font-size:.8rem;}
footer img{height:28px;vertical-align:middle;margin-right:8px;opacity:.6;}

@media(max-width:640px){
  .site-header{padding:14px 16px;}.site-logo{height:60px;}.header-center-logo{height:60px;}.header-nav{display:none;}
  .page{padding:28px 14px 60px;}
  .mgr-hero{gap:16px;}.mgr-avatar{width:68px;height:68px;}
}
</style>
</head>
<body>

<header class="site-header">
  <img class="site-logo" src="Spreeliga Monolog.png" alt="Spreeliga Monolog" onerror="this.style.display='none'">
  <img src="Spreeliga Logo frei fixed.png" alt="Spreeliga" class="header-center-logo" onerror="this.style.display='none'">
  <nav class="header-nav">
    <a class="nav-link" href="portal.html">← Portal</a>
    <a class="nav-link" href="portal.html#manager">Alle Manager</a>
  </nav>
</header>

<div class="page">
  <a href="portal.html#manager" class="back-link">← Alle Manager</a>

  <!-- Hero -->
  <div class="mgr-hero">
    <div class="mgr-avatar-wrap">
      <img class="mgr-avatar" src="Avatare/Luki.png" alt="Lukas Hechmann" onerror="this.style.background='#1a3050'">
    </div>
    <div class="mgr-info">
      <div class="mgr-season">Saison 2025/26 · Spreeliga</div>
      <div class="mgr-name">Lukas Hechmann</div>
      <div class="mgr-tags">
        <span class="mgr-tag">Neu in der Liga</span>
      </div>
    </div>
  </div>

  <!-- Placeholder Kader -->
  <div class="placeholder-box">
    <div class="ph-icon">⚽</div>
    <div class="ph-title">Kader folgt</div>
    <div class="ph-sub">Die Kaderdaten für Lukas Hechmann werden hier hinterlegt,<br>sobald die Saison beginnt.</div>
  </div>

  <!-- Navigation -->
  <div class="pn-nav">
    <a class="pn-link" href="manager-schulle.html">← Schulle</a>
    <span class="pn-center">11 / 11 Manager</span>
    <span class="pn-link pn-dis">→</span>
  </div>
</div>

<footer>
  <img src="Spreeliga Monolog.png" alt="Logo" onerror="this.style.display='none'">
  Spreeliga Monolog · KickerInter · Saison 2025/26
</footer>

</body>
</html>
